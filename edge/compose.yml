# Edge proxy for every app on this server. It belongs to the server, not to any app,
# so each app can be deployed, redeployed or removed without touching the others.
# The contract apps rely on is in ../README.md.
#
#   lobby setup   # once per server: creates the proxy network and certificate volume
#   lobby edge    # start or update Traefik
#
# ACME_EMAIL (optional) comes from edge/.env; see .env.example next to this file.
name: edge

services:
  traefik:
    image: traefik:v3.6  # >= 3.6: older releases cannot talk to Docker 29 (API >= 1.44)
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=le
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --log.level=INFO
      - --accesslog=true
      # URL paths can carry secrets (tokens, signed links, file names), so log JSON and
      # drop the path and request line. Field filtering only works with the JSON
      # format. Request headers (Referer, cookies) are dropped too. Host, status,
      # router, duration and client IP stay.
      - --accesslog.format=json
      - --accesslog.fields.defaultmode=keep
      - --accesslog.fields.names.RequestPath=drop
      - --accesslog.fields.names.RequestLine=drop
      - --accesslog.fields.headers.defaultmode=drop
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks: [proxy]

networks:
  proxy:
    external: true

volumes:
  # Certificates and the Let's Encrypt account. External so it outlives the stack.
  letsencrypt:
    external: true
    name: traefik_letsencrypt
